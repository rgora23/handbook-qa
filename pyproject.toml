[project]
name = "handbook-qa"
version = "0.1.0"
description = "Ask questions about a company handbook and get answers with page citations."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15",
    "fastembed>=0.9",
    "numpy>=2.0",
    "pypdf>=6.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.0"]

[project.scripts]
ask = "handbook_qa.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["handbook_qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
